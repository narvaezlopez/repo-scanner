<section class="loading">
  <h2 class="loading__title">Analizando @if (name()) {<span>{{ name() }}</span>}</h2>
  <p class="loading__label">{{ label() }}</p>

  <div #anim class="loading__anim" aria-hidden="true"></div>

  <p class="loading__pct" role="progressbar" [attr.aria-valuenow]="pct()">{{ pct() }}%</p>
</section>
