<section class="loading">
  <h2 class="loading__title">Analizando @if (name()) {<span>{{ name() }}</span>}</h2>
  <p class="loading__label">{{ label() }}</p>

  <div class="loading__bar" role="progressbar" [attr.aria-valuenow]="pct()">
    <div class="loading__bar-fill" [style.width.%]="pct()"></div>
  </div>
  <p class="loading__pct">{{ pct() }}%</p>
</section>
