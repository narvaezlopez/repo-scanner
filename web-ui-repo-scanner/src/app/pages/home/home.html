<header class="home__header">
  <img src="icons/r-scanner-logo.png" alt="R-Scan" class="home__header__icon" />
  <h1 class="home__header__title">R-Scan</h1>
  @if (user()) {
    <button type="button" class="btn home__header__logout" (click)="logout()">Salir</button>
  }
</header>

<div class="home__content">
  @switch (phase()) {
    @case ('idle') {
      <app-landing
        [welcome]="user()?.displayName || user()?.email || ''"
        (source)="onSource($event)"
      ></app-landing>
    }
    @case ('uploading') {
      <app-loading [progress]="0" step="upload" message="Subiendo el repositorio…"></app-loading>
    }
    @case ('analyzing') {
      <app-loading
        [progress]="job()?.progress ?? 0"
        [step]="job()?.step ?? null"
        [name]="job()?.source?.name ?? ''"
      ></app-loading>
    }
    @case ('done') {
      @if (job()?.result; as result) {
        <app-dashboard [result]="result" [name]="job()?.source?.name ?? ''"></app-dashboard>
      }
      <div class="home__again">
        <button type="button" class="btn btn--primary" (click)="reset()">
          Analizar otro repo
        </button>
      </div>
    }
    @case ('error') {
      <p class="home__status home__status--error" role="alert">{{ errorMsg() }}</p>
      <button type="button" class="btn btn--ghost" (click)="reset()">Volver a intentar</button>
    }
  }
</div>
