<header class="home__header">
    <img src="icons/r-scanner-logo.png" alt="R-Scan Icon" class="home__header__icon">
    <h1 class="home__header__title">R-Scan</h1>
</header>
<div class="home__content">
    <app-landing (source)="onSource($event)"></app-landing>

    @if (loading()) {
        <p class="home__status">Subiendo…</p>
    } @else if (jobId(); as id) {
        <p class="home__status home__status--ok">Job creado — id: <code>{{ id }}</code></p>
    } @else if (error(); as message) {
        <p class="home__status home__status--error" role="alert">{{ message }}</p>
    }
</div>
