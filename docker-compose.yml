# Espejo local del despliegue: API en contenedor + SPA servida por nginx.
# Sirve para verificar que ambas imágenes construyen y responden antes de
# llevarlas a AWS (ECS Fargate para la API, S3+CloudFront para la SPA).
services:
  api:
    build: ./ws-repo-scanner
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      CORS_ORIGIN: "http://localhost:8088"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5

  web:
    build: ./web-ui-repo-scanner
    ports:
      - "8088:8080"
    depends_on:
      - api
